services:
  - type: web
    name: resolveflow
    env: python
    buildCommand: "pip install -r requirements.txt && python backend/seed.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
